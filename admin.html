<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>صندوق العيد · المسؤول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app"></div>
<script src="/shared.js"></script>
<script>
(function () {
  const { MONTHS, MIN, esc, fmt, curMonth, monthName, hero } = window.EID;
  const app = document.getElementById("app");
  let pw = "";
  try { pw = sessionStorage.getItem("eid-admin-pw") || ""; } catch (e) {}
  let state = null, dirty = false;

  const api = (method, body) => fetch("/api/admin", {
    method, cache: "no-store",
    headers: { "x-admin-password": pw, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });

  function renderLogin(msg) {
    app.innerHTML = hero(`<span class="eyebrow">قسم المسؤول</span>`) + `<main><div class="wrap">
      <form class="login" id="lf">
        <label class="label" for="pw">كلمة مرور المسؤول</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        ${msg ? `<p class="err">${msg}</p>` : ""}
        <button class="btn primary" type="submit">دخول</button>
      </form></div></main>`;
    document.getElementById("lf").onsubmit = async e => {
      e.preventDefault();
      pw = document.getElementById("pw").value;
      await loadData();
    };
  }

  async function loadData() {
    try {
      const r = await api("GET");
      if (r.status === 401) { pw = ""; try { sessionStorage.removeItem("eid-admin-pw"); } catch (e) {} return renderLogin("كلمة المرور غير صحيحة."); }
      if (!r.ok) throw 0;
      state = await r.json();
      try { sessionStorage.setItem("eid-admin-pw", pw); } catch (e) {}
      render();
    } catch (e) { renderLogin("تعذر الاتصال بالخادم. حاول مرة ثانية."); }
  }

  const cls = v => (v === "" || v == null) ? "" : (Number(v) >= MIN ? "paid" : "low");
  const rowTotal = id => { const p = state.pay[id] || {}; return MONTHS.reduce((s, [k]) => s + (Number(p[k]) || 0), 0); };

  function render() {
    const cm = curMonth();
    const rows = state.names.map(n => {
      const p = state.pay[n.id] || {};
      return `<tr data-id="${esc(n.id)}"><td class="nm">${esc(n.name)}</td>${MONTHS.map(([k]) => { const v = p[k] ?? ""; return `<td><input type="number" inputmode="numeric" min="0" data-k="${k}" value="${esc(v)}" class="${cls(v)}" aria-label="${esc(n.name)} - ${monthName(k)}"></td>`; }).join("")}<td class="rt">${fmt(rowTotal(n.id))}</td><td><button class="del" data-del="${esc(n.id)}">حذف</button></td></tr>`;
    }).join("");
    app.innerHTML = hero(`<a class="home" href="/">صفحة الأفراد ←</a>`) + `<main style="padding-bottom:6rem"><div class="wrap wide">
      <div class="stats" id="stats"></div>
      <div class="addrow"><input id="newName" type="text" placeholder="أضف اسم مشارك" autocomplete="off"><button class="btn primary" id="addBtn">إضافة</button></div>
      ${state.names.length ? `<div class="tablebox"><table><thead><tr><th class="nm">الاسم</th>${MONTHS.map(([k, l]) => `<th>${l}${k === cm ? " ·الحالي" : ""}</th>`).join("")}<th>المجموع</th><th></th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td class="nm">الإجمالي</td>${MONTHS.map(([k]) => `<td id="t-${k}"></td>`).join("")}<td id="t-all"></td><td></td></tr></tfoot></table></div>
      <div class="legend"><span>مدفوع (${fmt(MIN)} أو أكثر)</span><span class="l">أقل من الحد الأدنى</span></div>`
      : `<div class="empty">أضف أسماء المشاركين، وبتظهر لهم في صفحة الأفراد ليختاروا منها.</div>`}
    </div></main>
    <div class="savebar"><div class="wrap wide"><span class="status" id="status">${dirty ? "تعديلات غير محفوظة" : "كل شي محفوظ"}</span><button class="btn primary" id="save" ${dirty ? "" : "disabled"}>حفظ</button></div></div>`;
    updateStats();

    const nn = document.getElementById("newName");
    const add = () => {
      const v = nn.value.trim(); if (!v) return;
      if (state.names.some(x => x.name === v)) { nn.value = ""; return; }
      const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      state.names.push({ id, name: v }); state.pay[id] = {}; dirty = true; render();
      document.getElementById("newName").focus();
    };
    document.getElementById("addBtn").onclick = add;
    nn.onkeydown = e => { if (e.key === "Enter") add(); };
    app.querySelectorAll("tbody input").forEach(inp => inp.oninput = () => {
      const id = inp.closest("tr").dataset.id, k = inp.dataset.k;
      state.pay[id] = state.pay[id] || {};
      if (inp.value === "") delete state.pay[id][k]; else state.pay[id][k] = Number(inp.value);
      inp.className = cls(inp.value);
      inp.closest("tr").querySelector(".rt").textContent = fmt(rowTotal(id));
      markDirty(); updateStats();
    });
    app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent = "تأكيد الحذف"; setTimeout(() => { if (b.isConnected) { b.classList.remove("arm"); b.textContent = "حذف"; } }, 3000); return; }
      const id = b.dataset.del; state.names = state.names.filter(n => n.id !== id); delete state.pay[id]; dirty = true; render();
    });
    document.getElementById("save").onclick = save;
  }
  function markDirty() { dirty = true; document.getElementById("save").disabled = false; document.getElementById("status").textContent = "تعديلات غير محفوظة"; }
  function updateStats() {
    const cm = curMonth(), col = {}; let all = 0;
    MONTHS.forEach(([k]) => col[k] = 0);
    state.names.forEach(n => { const p = state.pay[n.id] || {}; MONTHS.forEach(([k]) => { const v = Number(p[k]) || 0; col[k] += v; all += v; }); });
    const paidNow = state.names.filter(n => (Number((state.pay[n.id] || {})[cm]) || 0) >= MIN).length;
    document.getElementById("stats").innerHTML =
      `<div class="stat"><small>إجمالي الصندوق</small><b>${fmt(all)} ر.س</b></div>
       <div class="stat"><small>عدد المشاركين</small><b>${fmt(state.names.length)}</b></div>
       <div class="stat"><small>دفعوا ${monthName(cm)}</small><b>${fmt(paidNow)} / ${fmt(state.names.length)}</b></div>
       <div class="stat"><small>تحصيل ${monthName(cm)}</small><b>${fmt(col[cm])} ر.س</b></div>`;
    MONTHS.forEach(([k]) => { const c = document.getElementById("t-" + k); if (c) c.textContent = fmt(col[k]); });
    const a = document.getElementById("t-all"); if (a) a.textContent = fmt(all);
  }
  async function save() {
    const btn = document.getElementById("save"), st = document.getElementById("status");
    btn.disabled = true; st.textContent = "جارٍ الحفظ…";
    try {
      const r = await api("POST", state);
      if (r.status === 401) { st.textContent = "انتهت الجلسة، سجّل دخول من جديد."; btn.disabled = false; return; }
      if (!r.ok) throw 0;
      dirty = false; st.textContent = "تم الحفظ";
    } catch (e) { btn.disabled = false; st.textContent = "تعذر الحفظ، حاول مرة ثانية."; }
  }
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  if (pw) loadData(); else renderLogin();
})();
</script>
</body>
</html>
