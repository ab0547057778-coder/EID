<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صندوق العيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app"></div>
<script src="/shared.js"></script>
<script>
(function () {
  const { MONTHS, MIN, ADMIN_WA, METHODS, esc, fmt, curMonth, monthName, flash, copyText, hero } = window.EID;
  const app = document.getElementById("app");
  let names = null, loadError = false;
  const ui = { nameId: "", month: curMonth(), amount: "", method: "" };

  function render() {
    let nameStep;
    if (loadError) nameStep = `<div class="empty">تعذر تحميل الأسماء. حدّث الصفحة.</div>`;
    else if (names === null) nameStep = `<div class="empty">جارٍ تحميل الأسماء…</div>`;
    else if (!names.length) nameStep = `<div class="empty">لم يضف المسؤول قائمة الأسماء بعد. ارجع لهذه الصفحة بعد قليل.</div>`;
    else nameStep = `<select id="who"><option value="">اختر اسمك من القائمة</option>${names.map(n => `<option value="${esc(n.id)}" ${n.id === ui.nameId ? "selected" : ""}>${esc(n.name)}</option>`).join("")}</select>`;

    app.innerHTML = hero() + `<main><div class="wrap">
      <section class="step"><div class="label"><i>١</i>اسمك</div>${nameStep}</section>
      <section class="step"><div class="label"><i>٢</i>الشهر</div>
        <div class="chips" id="months">${MONTHS.map(([k, l]) => `<button class="chip" data-m="${k}" aria-pressed="${k === ui.month}">${l}</button>`).join("")}</div></section>
      <section class="step"><div class="label"><i>٣</i>قيمة مساهمتك</div>
        <div class="chips" id="quick">${[25, 50, 75, 100, 150].map(v => `<button class="chip" data-v="${v}" aria-pressed="${String(v) === String(ui.amount)}">${fmt(v)}</button>`).join("")}</div>
        <div class="amount-row"><input id="amt" type="number" inputmode="numeric" min="${MIN}" step="1" placeholder="${MIN}" value="${esc(ui.amount)}" aria-label="المبلغ بالريال"><span>ريال</span></div>
        <p class="err" id="amtErr" hidden>الحد الأدنى للمساهمة ${fmt(MIN)} ريال.</p>
        <p class="hint">المساهمة مفتوحة، شارك بالقدر اللي تقدر عليه.</p></section>
      <section class="step" id="sumStep"></section>
      <section class="step"><div class="label"><i>٤</i>طرق التحويل</div>
        <p class="hint">اختر الطريقة اللي تناسبك وانسخ الرقم.</p>
        <div class="methods">${METHODS.map(m => {
          const open = ui.method === m.key;
          const det = m.rows.map(([k, v]) => `<div class="kv"><div><small>${k}</small><code>${v}</code></div><button class="copy" data-copy="${v}">نسخ</button></div>`).join("");
          return `<div class="method" data-open="${open}"><button data-method="${m.key}" aria-expanded="${open}"><span class="dot" style="background:${m.color}"></span><span class="name">${m.name}</span><span class="arrow">${open ? "إخفاء" : "عرض"}</span></button><div class="details" ${open ? "" : "hidden"}>${det}</div></div>`;
        }).join("")}</div>
      </section>
      <section class="step" id="notify"></section>
      <p class="closing">الأهم من المبلغ والمكان جمعتنا ولمّتنا الحلوة يوم العيد.</p>
    </div></main>`;

    const who = document.getElementById("who");
    if (who) who.onchange = () => { ui.nameId = who.value; updateSummary(); };
    app.querySelectorAll("#months .chip").forEach(b => b.onclick = () => { ui.month = b.dataset.m; app.querySelectorAll("#months .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); updateSummary(); });
    app.querySelectorAll("#quick .chip").forEach(b => b.onclick = () => { ui.amount = b.dataset.v; document.getElementById("amt").value = ui.amount; syncQuick(); updateSummary(); });
    document.getElementById("amt").oninput = e => { ui.amount = e.target.value.trim(); syncQuick(); updateSummary(); };
    app.querySelectorAll("[data-method]").forEach(b => b.onclick = () => { ui.method = ui.method === b.dataset.method ? "" : b.dataset.method; render(); });
    app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(b.dataset.copy, b));
    updateSummary();
  }
  function syncQuick() { app.querySelectorAll("#quick .chip").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v) === String(ui.amount))); }
  function updateSummary() {
    const amt = Number(ui.amount);
    const valid = ui.amount !== "" && amt >= MIN;
    document.getElementById("amtErr").hidden = !(ui.amount !== "" && amt < MIN);
    const person = (names || []).find(n => n.id === ui.nameId);
    document.getElementById("sumStep").innerHTML = `<div class="total"><div><div class="who">${person ? esc(person.name) + " · " : ""}مساهمتك لشهر ${monthName(ui.month)}</div></div><div class="num">${valid ? fmt(amt) : "—"}<small>ريال</small></div></div>`;
    const method = METHODS.find(m => m.key === ui.method);
    const ready = person && valid;
    const msg = ready ? `السلام عليكم، أنا ${person.name}. حوّلت مساهمتي في صندوق العيد لشهر ${monthName(ui.month)}: ${amt} ريال${method ? " عن طريق " + method.name : ""}.` : "";
    const n = document.getElementById("notify");
    n.innerHTML = `<div class="label"><i>٥</i>بعد التحويل</div>
      <p class="hint">${ready ? "بلّغ المسؤول عشان يسجّل مساهمتك في القائمة." : "اختر اسمك واكتب المبلغ عشان تجهز رسالة الإشعار."}</p>
      <div class="actions"><a class="btn primary" ${ready ? `href="https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"` : 'aria-disabled="true" style="opacity:.45;pointer-events:none"'}>إرسال الإشعار بالواتساب</a>
      <button class="btn ghost" id="cpmsg" ${ready ? "" : "disabled"}>نسخ نص الإشعار</button></div>`;
    const cp = document.getElementById("cpmsg");
    if (ready) cp.onclick = async () => { try { await navigator.clipboard.writeText(msg); flash(cp, "تم النسخ"); } catch (e) { flash(cp, "تعذر النسخ"); } };
  }

  render();
  fetch("/api/names", { cache: "no-store" })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(d => { names = (d.names || []).sort((a, b) => a.name.localeCompare(b.name, "ar")); render(); })
    .catch(() => { loadError = true; render(); });
})();
</script>
</body>
</html>
